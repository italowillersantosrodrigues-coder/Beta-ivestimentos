<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Clientes - Beta Investimentos</title>
  <style>
    body {
      background: #111;
      color: #fff;
      font-family: "Segoe UI", Tahoma, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      background: #1c1c1c;
      padding: 15px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }

    header h1 {
      color: #4CAF50;
      font-size: 22px;
    }

    .back-btn {
      background: #4CAF50;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      cursor: pointer;
      transition: 0.3s;
    }
    .back-btn:hover { background: #45a049; }

    .container {
      width: 95%;
      max-width: 900px;
      background: #1e1e1e;
      border-radius: 15px;
      padding: 30px;
      margin-top: 40px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.4);
    }

    h2 {
      text-align: center;
      color: #4CAF50;
      margin-bottom: 25px;
    }

    form {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    input, select {
      flex: 1 1 200px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #2c2c2c;
      color: #fff;
    }

    button {
      padding: 12px 20px;
      background: #4CAF50;
      border: none;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover { background: #45a049; }

    .msg {
      text-align: center;
      margin-top: 10px;
      font-size: 14px;
    }

    ul {
      list-style: none;
      padding: 0;
      margin-top: 30px;
    }

    li {
      background: #2c2c2c;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    .cliente-info {
      flex: 1 1 70%;
    }

    .cliente-info span {
      display: block;
      font-size: 14px;
      color: #ddd;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .actions button {
      padding: 6px 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }

    .btn-edit { background: #f6ad55; color: #fff; }
    .btn-delete { background: #e53e3e; color: #fff; }
    .btn-edit:hover { background: #dd6b20; }
    .btn-delete:hover { background: #c53030; }
  </style>
</head>
<body>
  <header>
    <h1>Clientes</h1>
    <button class="back-btn" onclick="window.location.href='menu.html'">⬅ Menu</button>
  </header>

  <div class="container">
    <h2>Cadastro de Clientes</h2>
    <form id="formCliente">
      <input type="hidden" id="clienteId">
      <input type="text" id="nome" placeholder="Nome completo" required>
      <input type="email" id="email" placeholder="E-mail" required>
      <input type="text" id="telefone" placeholder="Telefone">
      <input type="text" id="cpf" placeholder="CPF">
      <input type="text" id="cidade" placeholder="Cidade">
      <select id="status">
        <option value="Ativo">Ativo</option>
        <option value="Inativo">Inativo</option>
      </select>
      <button type="submit">Salvar</button>
    </form>

    <div class="msg" id="mensagem"></div>

    <ul id="listaClientes"></ul>
  </div>

  <script>
    const API_URL = "/api/clients";

    async function carregarClientes() {
      const ul = document.getElementById("listaClientes");
      ul.innerHTML = "<p style='text-align:center;'>Carregando...</p>";

      try {
        const resp = await fetch(API_URL);
        if (!resp.ok) throw new Error("Erro ao buscar clientes");
        const clientes = await resp.json();

        if (!Array.isArray(clientes) || clientes.length === 0) {
          ul.innerHTML = "<p style='text-align:center;color:#aaa;'>Nenhum cliente cadastrado ainda.</p>";
          return;
        }

        ul.innerHTML = "";
        clientes.forEach(c => {
          const li = document.createElement("li");
          li.innerHTML = `
            <div class="cliente-info">
              <strong>${c.nome}</strong>
              <span>${c.email}</span>
              <span>📞 ${c.telefone || "-"}</span>
              <span>CPF: ${c.cpf || "-"}</span>
              <span>Cidade: ${c.cidade || "-"}</span>
              <span>Status: ${c.status || "Ativo"}</span>
              <span style="font-size:12px;color:#999;">Cadastrado: ${c.createdAt ? new Date(c.createdAt).toLocaleDateString() : "-"}</span>
            </div>
            <div class="actions">
              <button class="btn-edit" onclick='editar(${JSON.stringify(c)})'>Editar</button>
              <button class="btn-delete" onclick='excluir("${c._id}")'>Excluir</button>
            </div>
          `;
          ul.appendChild(li);
        });
      } catch (err) {
        console.error("Erro ao carregar clientes:", err);
        ul.innerHTML = "<p style='text-align:center;color:red;'>Erro ao carregar lista de clientes.</p>";
      }
    }

    function editar(c) {
      document.getElementById("clienteId").value = c._id;
      document.getElementById("nome").value = c.nome;
      document.getElementById("email").value = c.email;
      document.getElementById("telefone").value = c.telefone || "";
      document.getElementById("cpf").value = c.cpf || "";
      document.getElementById("cidade").value = c.cidade || "";
      document.getElementById("status").value = c.status || "Ativo";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function excluir(id) {
      if (!confirm("Excluir cliente permanentemente?")) return;
      try {
        const resp = await fetch(`${API_URL}/${id}`, { method: "DELETE" });
        if (!resp.ok) throw new Error();
        mostrarMensagem("Cliente excluído com sucesso!", "green");
        carregarClientes();
      } catch {
        mostrarMensagem("Erro ao excluir cliente.", "red");
      }
    }

    document.getElementById("formCliente").addEventListener("submit", async (e) => {
      e.preventDefault();
      const id = document.getElementById("clienteId").value;
      const cliente = {
        nome: document.getElementById("nome").value.trim(),
        email: document.getElementById("email").value.trim(),
        telefone: document.getElementById("telefone").value.trim(),
        cpf: document.getElementById("cpf").value.trim(),
        cidade: document.getElementById("cidade").value.trim(),
        status: document.getElementById("status").value
      };

      try {
        const method = id ? "PUT" : "POST";
        const url = id ? `${API_URL}/${id}` : API_URL;
        const resp = await fetch(url, {
          method,
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(cliente)
        });

        if (!resp.ok) throw new Error();
        e.target.reset();
        document.getElementById("clienteId").value = "";
        mostrarMensagem("Cliente salvo com sucesso!", "green");
        carregarClientes();
      } catch (err) {
        console.error(err);
        mostrarMensagem("Erro ao salvar cliente.", "red");
      }
    });

    function mostrarMensagem(texto, cor = "white") {
      const msg = document.getElementById("mensagem");
      msg.style.color = cor;
      msg.textContent = texto;
      setTimeout(() => msg.textContent = "", 3000);
    }

    carregarClientes();
  </script>
</body>
</html>
