<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Clientes - Beta Investimentos</title>
  <style>
    body {
      background: #111;
      color: #fff;
      font-family: "Segoe UI", Tahoma, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      background: #1c1c1c;
      padding: 15px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }

    header h1 { color: #4CAF50; font-size: 22px; }

    .back-btn {
      background: #4CAF50; color: #fff; border: none; border-radius: 8px;
      padding: 10px 18px; cursor: pointer; transition: 0.3s;
    }
    .back-btn:hover { background: #45a049; }

    .container {
      width: 90%;
      max-width: 700px;
      background: #1e1e1e;
      border-radius: 15px;
      padding: 30px;
      margin-top: 40px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.4);
    }

    h2 { text-align: center; color: #4CAF50; margin-bottom: 25px; }

    form {
      display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
    }

    input {
      flex: 1 1 200px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #2c2c2c;
      color: #fff;
    }

    button {
      padding: 12px 20px;
      background: #4CAF50;
      border: none;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover { background: #45a049; }

    ul { list-style: none; padding: 0; margin-top: 25px; }

    li {
      background: #2c2c2c;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .actions button {
      padding: 6px 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }

    .btn-edit { background: #f6ad55; color: #fff; }
    .btn-delete { background: #e53e3e; color: #fff; }
    .btn-edit:hover { background: #dd6b20; }
    .btn-delete:hover { background: #c53030; }
  </style>
</head>
<body>
  <header>
    <h1>Clientes</h1>
    <button class="back-btn" onclick="window.location.href='menu.html'">⬅ Menu</button>
  </header>

  <div class="container">
    <h2>Cadastro de Clientes</h2>
    <form id="formCliente">
      <input type="hidden" id="clienteId">
      <input type="text" id="nome" placeholder="Nome" required>
      <input type="email" id="email" placeholder="E-mail" required>
      <input type="text" id="telefone" placeholder="Telefone">
      <button type="submit">Salvar</button>
    </form>

    <ul id="listaClientes"></ul>
  </div>

  <script>
    async function carregarClientes() {
      const resp = await fetch("/api/clientes");
      const clientes = await resp.json();
      const ul = document.getElementById("listaClientes");
      ul.innerHTML = "";
      clientes.forEach(c => {
        const li = document.createElement("li");
        li.innerHTML = `
          <div>${c.nome} - ${c.email} - ${c.telefone}</div>
          <div class="actions">
            <button class="btn-edit" onclick='editar(${JSON.stringify(c)})'>Editar</button>
            <button class="btn-delete" onclick='excluir(${c.id})'>Excluir</button>
          </div>`;
        ul.appendChild(li);
      });
    }

    function editar(c) {
      document.getElementById("clienteId").value = c.id;
      document.getElementById("nome").value = c.nome;
      document.getElementById("email").value = c.email;
      document.getElementById("telefone").value = c.telefone;
    }

    async function excluir(id) {
      if (confirm("Excluir cliente?")) {
        await fetch(`/api/clientes/${id}`, { method: "DELETE" });
        carregarClientes();
      }
    }

    document.getElementById("formCliente").addEventListener("submit", async (e) => {
      e.preventDefault();
      const id = document.getElementById("clienteId").value;
      const nome = document.getElementById("nome").value;
      const email = document.getElementById("email").value;
      const telefone = document.getElementById("telefone").value;

      const method = id ? "PUT" : "POST";
      const url = id ? `/api/clientes/${id}` : "/api/clientes";
      await fetch(url, {
        method,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nome, email, telefone })
      });

      e.target.reset();
      carregarClientes();
    });

    carregarClientes();
  </script>
</body>
</html>
