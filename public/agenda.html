<!-- public/agenda.html -->
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <title>Agenda - Beta Investimentos</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
  <header class="bg-gray-800 p-4 flex items-center gap-4">
    <a href="/menu.html" class="text-green-400 font-bold px-3 py-1 rounded bg-gray-900/30">← Menu</a>
    <h1 class="text-xl font-bold">Agenda / Monitoramento</h1>
    <div class="flex-1"></div>
    <button id="btnNew" class="bg-green-600 px-3 py-1 rounded">Novo</button>
  </header>

  <main class="max-w-6xl mx-auto p-6 space-y-6">
    <section class="bg-gray-800 p-4 rounded flex gap-3 items-center">
      <input id="filterDate" type="date" class="p-2 rounded bg-gray-700" />
      <select id="filterStatus" class="p-2 rounded bg-gray-700">
        <option value="">— Todos —</option>
        <option value="pending">Pendente</option>
        <option value="done">Concluído</option>
        <option value="cancel">Cancelado</option>
      </select>
      <input id="filterSearch" placeholder="buscar cliente/descrição/técnico" class="p-2 rounded bg-gray-700 flex-1" />
      <button id="btnApply" class="bg-blue-600 px-3 py-1 rounded">Aplicar</button>
      <button id="btnClear" class="bg-gray-700 px-3 py-1 rounded">Limpar</button>
    </section>

    <section class="grid grid-cols-1 lg:grid-cols-3 gap-4">
      <div class="lg:col-span-2 bg-gray-800 p-4 rounded">
        <div class="mb-2 font-semibold">Lista</div>
        <div class="overflow-auto max-h-96">
          <table class="w-full text-left text-sm">
            <thead class="text-gray-300"><tr><th>Data / Hora</th><th>Cliente</th><th>Valor</th><th>Status</th><th></th></tr></thead>
            <tbody id="eventsTable" class="text-gray-200"></tbody>
          </table>
        </div>
      </div>

      <div class="bg-gray-800 p-4 rounded">
        <div class="font-semibold mb-2">Resumo</div>
        <div class="space-y-2 text-sm text-gray-300">
          <div id="countTotal">Eventos: —</div>
          <div id="countPending">Pendentes: —</div>
          <div id="sumValue">Total R$ —</div>
        </div>
      </div>
    </section>
  </main>

  <!-- modal (simples) -->
  <div id="modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center">
    <div class="bg-gray-800 p-4 rounded w-full max-w-xl">
      <h3 id="modalTitle" class="font-semibold mb-2">Novo compromisso</h3>
      <form id="formAgenda" class="space-y-2">
        <input type="hidden" id="evId" />
        <div class="grid grid-cols-2 gap-2">
          <input id="evDate" type="date" required class="p-2 rounded bg-gray-700" />
          <input id="evTime" type="time" required class="p-2 rounded bg-gray-700" />
          <input id="evClient" placeholder="Cliente" class="p-2 rounded bg-gray-700 col-span-2" />
          <select id="evTech" class="p-2 rounded bg-gray-700"><option value="">— técnico —</option></select>
          <input id="evValue" type="number" step="0.01" placeholder="Valor" class="p-2 rounded bg-gray-700" />
          <select id="evStatus" class="p-2 rounded bg-gray-700">
            <option value="pending">Pendente</option>
            <option value="done">Concluído</option>
            <option value="cancel">Cancelado</option>
          </select>
        </div>
        <textarea id="evDesc" rows="3" class="p-2 rounded bg-gray-700 w-full" placeholder="Descrição"></textarea>
        <div class="flex justify-end gap-2">
          <button type="button" id="btnCancel" class="bg-gray-700 px-3 py-1 rounded">Cancelar</button>
          <button type="submit" id="btnSave" class="bg-green-600 px-3 py-1 rounded">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/agenda.js"></script>
</body>
</html>
