<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Vendas - Beta Investimentos</title>
  <style>
    body {
      background: #111;
      color: #fff;
      font-family: "Segoe UI", Tahoma, sans-serif;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      width: 100%;
      background: #1c1c1c;
      padding: 15px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }

    header h1 { color: #4CAF50; font-size: 22px; }
    .back-btn {
      background: #4CAF50;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      cursor: pointer;
      transition: 0.3s;
    }
    .back-btn:hover { background: #45a049; }

    .container {
      width: 90%;
      max-width: 850px;
      background: #1e1e1e;
      border-radius: 15px;
      padding: 30px;
      margin-top: 40px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.4);
    }

    h2 { text-align: center; color: #4CAF50; margin-bottom: 25px; }

    label { display: block; margin: 8px 0 4px; }

    select, input {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #2c2c2c;
      color: #fff;
      margin-bottom: 10px;
    }

    button {
      background: #4CAF50;
      border: none;
      border-radius: 8px;
      color: #fff;
      padding: 12px 20px;
      cursor: pointer;
      transition: 0.3s;
      width: 100%;
      margin-top: 10px;
    }

    button:hover { background: #45a049; }

    .produto-item { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
    .produto-item select, .produto-item input { flex: 1; }
    .produto-item button { flex: 0.3; background: #e53e3e; }
    .produto-item button:hover { background: #c53030; }

    .hidden { display: none !important; }
    table { width: 100%; margin-top: 20px; border-collapse: collapse; }
    th, td { border-bottom: 1px solid #333; padding: 10px; text-align: left; }
  </style>
</head>
<body>
  <header>
    <h1>Vendas</h1>
    <button class="back-btn" onclick="window.location.href='menu.html'">⬅ Menu</button>
  </header>

  <div class="container">
    <h2>Cadastro de Venda</h2>

    <form id="formVenda">
      <label>Cliente</label>
      <select id="clienteSelect" required></select>

      <label>Produtos</label>
      <div id="listaProdutosVenda"></div>
      <button type="button" onclick="adicionarProduto()">+ Adicionar Produto</button>

      <label>Método de Pagamento</label>
      <select id="metodoPagamento" required>
        <option value="">Selecione</option>
        <option value="pix">Pix</option>
        <option value="cartao">Cartão</option>
        <option value="dinheiro">Dinheiro</option>
        <option value="carne">Carnê</option>
      </select>

      <div id="grupoCarne" class="hidden">
        <label>Parcelas</label>
        <input type="number" id="qtdParcelas" placeholder="Quantidade de parcelas">
        <input type="number" id="valorParcela" step="0.01" placeholder="Valor da parcela">
        <input type="date" id="primeiroVencimento">
      </div>

      <label>Data da Compra</label>
      <input type="date" id="dataCompra" required>

      <label>Total</label>
      <input type="text" id="totalVenda" readonly>

      <button type="submit">Salvar Venda</button>
    </form>

    <table id="tabelaParcelas" class="hidden">
      <thead><tr><th>#</th><th>Vencimento</th><th>Valor</th><th>Status</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    let produtosCache = [];

    const BRL = v => (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});

    async function carregarClientes() {
      const r = await fetch("/api/clientes");
      const clientes = await r.json();
      const s = document.getElementById("clienteSelect");
      s.innerHTML = "<option value=''>Selecione</option>";
      clientes.forEach(c => s.innerHTML += `<option value="${c.id}">${c.nome}</option>`);
    }

    async function carregarProdutos() {
      const r = await fetch("/api/produtos");
      produtosCache = await r.json();
    }

    function adicionarProduto() {
      const div = document.createElement("div");
      div.className = "produto-item";
      div.innerHTML = `
        <select>${produtosCache.map(p=>`<option value="${p.id}">${p.nome} (${BRL(p.preco)})</option>`).join("")}</select>
        <input type="number" min="1" value="1">
        <button type="button" onclick="this.parentElement.remove(); atualizarTotal();">Remover</button>
      `;
      document.getElementById("listaProdutosVenda").appendChild(div);
      atualizarTotal();
    }

    function atualizarTotal() {
      let total = 0;
      document.querySelectorAll(".produto-item").forEach(d=>{
        const id = d.querySelector("select").value;
        const qtd = Number(d.querySelector("input").value);
        const prod = produtosCache.find(p=>p.id==id);
        if(prod) total += prod.preco * qtd;
      });
      document.getElementById("totalVenda").value = BRL(total);
    }

    document.addEventListener("change", e=>{
      if(e.target.id==="metodoPagamento")
        document.getElementById("grupoCarne").classList.toggle("hidden", e.target.value!=="carne");
    });

    document.getElementById("formVenda").addEventListener("submit", async e=>{
      e.preventDefault();
      alert("Venda salva com sucesso!");
      e.target.reset();
      document.getElementById("listaProdutosVenda").innerHTML="";
      document.getElementById("grupoCarne").classList.add("hidden");
    });

    carregarClientes();
    carregarProdutos();
  </script>
</body>
</html>
